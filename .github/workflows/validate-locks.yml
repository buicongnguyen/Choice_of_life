name: Check Choice of Life fixture history

# Runs on every push and pull request that can affect the locks. This was
# previously `workflow_dispatch` only, so the committed preregistration history
# was never validated automatically.
#
# `docs/**` is ignored on both triggers because documentation cannot change a
# fixture lock. `scripts/fixture-lock.mjs` is deliberately NOT ignored: a change
# to the validator itself is exactly when this job must run.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-locks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both validators diff against the commit the branch started from.
      - name: Validate committed preregistration history
        run: npm run fixtures:validate-preregistration
        env:
          CHOICE_LOCK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHOICE_FIXTURE_TEST_PREREG_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
